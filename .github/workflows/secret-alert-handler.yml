name: Secret Scanning Alert Handler

on:
  # secret_scanning_alert is NOT a valid Actions trigger event, so instead we
  # poll the Secret Scanning API on a schedule and on manual dispatch.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # Also run TruffleHog scan on pushes and PRs
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trufflehog-scan:
    name: TruffleHog Secret Scan
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  create-alert-issues:
    name: Create Issues for Open Secret Scanning Alerts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      security-events: read
    steps:
      - name: Poll open alerts and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_SCANNING_TOKEN: ${{ secrets.SECRET_SCANNING_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${SECRET_SCANNING_TOKEN:-}" ]; then
            echo "::error::SECRET_SCANNING_PAT repo secret is not set. The default GITHUB_TOKEN cannot read the Secret Scanning API."
            exit 1
          fi

          alert_numbers=$(GH_TOKEN="$SECRET_SCANNING_TOKEN" gh api "repos/$REPO/secret-scanning/alerts" --jq '.[] | select(.state=="open") | .number')

          if [ -z "$alert_numbers" ]; then
            echo "No open secret scanning alerts found."
            exit 0
          fi

          for alert_number in $alert_numbers; do
            dedupe_label="secret-alert-$alert_number"

            # Skip if we already opened an issue for this alert number
            existing=$(gh issue list --repo "$REPO" --label "$dedupe_label" --state all --json number --jq 'length')
            if [ "$existing" -gt 0 ]; then
              echo "Issue already exists for alert #$alert_number, skipping."
              continue
            fi

            alert_info=$(GH_TOKEN="$SECRET_SCANNING_TOKEN" gh api "repos/$REPO/secret-scanning/alerts/$alert_number")
            secret_type=$(echo "$alert_info" | jq -r .secret_type_display_name)
            state=$(echo "$alert_info" | jq -r .state)
            location=$(echo "$alert_info" | jq -r .first_location_detected.path)
            html_url=$(echo "$alert_info" | jq -r .html_url)

            severity="medium"
            if echo "$secret_type" | grep -qiE "token|key|password"; then
              severity="high"
            fi

            labels="security,secret-scanning,priority:$severity,$dedupe_label"

            gh issue create \
              --repo "$REPO" \
              --title "🚨 Secret Alert: $secret_type (#$alert_number)" \
              --body "# 🔐 Secret Scanning Alert

            ## 📋 Alert Details

            | Field | Value |
            |-------|-------|
            | 🏷️ **Type** | \`$secret_type\` |
            | 📊 **Status** | \`$state\` |
            | 🔍 **Location** | \`$location\` |
            | ⚠️ **Severity** | \`$severity\` |
            | 🔗 **Alert Link** | [View Alert]($html_url) |

            ## 🚨 Immediate Actions Required

            1. 🔎 **Verify the Secret**
               - Confirm if this is a real secret
               - Check if it's still active
               - Document exposure timeline

            2. 🔄 **Remediation Steps**
               - [ ] Rotate the credential immediately if valid
               - [ ] Review access logs for unauthorized usage
               - [ ] Check for other locations where this secret might exist
               - [ ] Update the alert status in GitHub

            3. 📝 **Documentation**
               - [ ] Record incident details
               - [ ] Note any systems impacted
               - [ ] Document remediation steps taken

            ## 🛡️ Prevention Guidelines

            ### Do's ✅
            - Use GitHub Environment Secrets
            - Implement strong secret rotation policies
            - Enable branch protection rules
            - Use pre-commit hooks for local scanning

            ### Don'ts ❌
            - Never commit secrets to repositories
            - Avoid sharing secrets in code or comments
            - Don't store secrets in plaintext
            - Don't ignore secret scanning alerts

            ## 📚 Resources

            - [Secret Scanning Documentation](https://docs.github.com/code-security/secret-scanning)
            - [Security Best Practices](https://docs.github.com/code-security/getting-started/security-guides)
            - [Custom Pattern Guide](https://docs.github.com/code-security/secret-scanning/defining-custom-patterns-for-secret-scanning)

            > 🤖 This issue was automatically created by the Secret Scanning Alert Handler
            >
            > Repository: $REPO
            > Alert Number: $alert_number
            > Created: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
              --label "$labels" \
              --assignee "Sebasxdd"
          done

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ ! -z "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text": "🚨 Secret scanning alert issues processed. Check the repo Issues tab."}' \
              "$SLACK_WEBHOOK_URL"
          fi
